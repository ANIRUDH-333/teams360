{{- if not .Values.global.postgresql.existingSecret.name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "postgresql.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.global.postgresql.credentials.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.global.postgresql.credentials.password | quote }}
  POSTGRES_DB: {{ .Values.global.postgresql.credentials.database | quote }}
  POSTGRES_HOST: {{ include "postgresql.serviceName" . | quote }}
  POSTGRES_PORT: "5432"
  POSTGRES_SSLMODE: {{ .Values.global.postgresql.credentials.sslmode | quote }}
{{- end }}
