apiVersion: v1
kind: Service
metadata:
  name: {{ include "postgresql.serviceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app: {{ include "postgresql.fullname" . }}
