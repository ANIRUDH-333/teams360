apiVersion: v1
kind: Service
metadata:
  name: {{ include "frontend.serviceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      name: http
  selector:
    {{- include "frontend.selectorLabels" . | nindent 4 }}
