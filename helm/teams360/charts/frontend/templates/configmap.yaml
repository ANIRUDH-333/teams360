apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "frontend.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  # Internal backend service URL for Next.js SSR API proxy
  BACKEND_URL: {{ printf "http://%s:%s" (include "frontend.apiServiceName" .) "8080" | quote }}
