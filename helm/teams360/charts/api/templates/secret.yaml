{{- if not .Values.existingSecret.name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "api.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "api.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ printf "postgres://%s:%s@%s:5432/%s?sslmode=%s"
    (.Values.global.postgresql.credentials.user | default "teams360")
    (.Values.global.postgresql.credentials.password | default "")
    (include "api.postgresql.serviceName" .)
    (.Values.global.postgresql.credentials.database | default "teams360")
    (.Values.global.postgresql.credentials.sslmode | default "disable") | quote }}
  JWT_SECRET: {{ .Values.secrets.JWT_SECRET | quote }}
{{- end }}
